name: Build werewolf purple agent
on:
  push:
    branches: [main]
    paths: ["agentbeats-purple/**", ".github/workflows/werewolf-purple.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr 只接受小写仓库名；GitHub 用户名是 Yuwann-Jiang，必须先转小写
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./agentbeats-purple
          file: ./agentbeats-purple/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/werewolf-purple:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/werewolf-purple:${{ github.sha }}
